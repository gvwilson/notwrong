project:
  type: book
  output-dir: docs

book:
  title: "How to Not Be Wrong About AI"
  repo-url: "https://github.com/gvwilson/notwrong"
  repo-actions: [edit, source, issue]
  chapters:
    - index.qmd
    - intro/index.qmd
    - productivity/index.qmd
    - wrong/index.qmd
    - qualitative/index.qmd
    - quantitative/index.qmd
    - observational/index.qmd
    - critical/index.qmd
    - running/index.qmd
    - cheaply/index.qmd
    - finale/index.qmd
  appendices:
    - license/index.qmd
    - conduct/index.qmd
    - contributing/index.qmd
    - bibliography/index.qmd
    - glossary/index.qmd
    - further/index.qmd
    - stats/index.qmd

bibliography: bibliography/references.bib
csl: mccole/book.csl

filters:
  - mccole/links.lua

shortcodes:
  - mccole/glossary.lua
  - mccole/inc-noh1.lua

format:
  html:
    css: mccole/book.css
    link-citations: true
    theme: cosmo
  pdf:
    documentclass: mccole/krantz
